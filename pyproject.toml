[project]
name = "lerobot-ros"
version = "0.1.0"
description = "Add your description here"
license = "MIT"
readme = "README.md"
dependencies = [
  "lerobot==0.5.1",
  "pytest>=9.0.2",
  "rerun>=1.0.31",
  "rust-py-timer>=0.1.0",
]

[project.optional-dependencies]
so101 = ["lerobot[feetech]>=0.4.2"]
smolvla = ["lerobot[smolvla]>=0.4.2"]

[dependency-groups]
# Dev/test-only tooling. The annotation GUI (annotation_server.py) is a
# dev-side tool: fastapi + uvicorn run it, and httpx drives it in tests via
# fastapi.testclient.TestClient (test/test_annotation_server.py). Kept out of
# [project.dependencies] so the lean rover/Jetson runtime image doesn't ship
# them. The ROS-side test deps (rclpy, rosbag2_py, std_msgs) come from the
# sourced ROS install, not pip.
dev = [
  "maturin>=1.11.2",
  "fastapi>=0.141.1",
  "uvicorn>=0.52.1",
  "httpx>=0.28",
]


[tool.ty.environment]
extra-paths = [
  "/opt/ros/jazzy/lib/python3.12/site-packages/",
  "install/lerobot_interfaces/lib/python3.12/site-packages/",
]
