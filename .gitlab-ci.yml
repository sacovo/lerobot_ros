include:
  - project: 'fhnw-rover/ansible'
    ref: main
    file: '/.gitlab/ci/components/ros/pipeline.yml'

stages:
  - test

ci-component-smoke:
  stage: test
  extends: .ros-arm-docker-runner
  image: alpine:3.20
  script:
    - test -d src
    - echo "lerobot_ros is onboarded to shared ROS CI components"
